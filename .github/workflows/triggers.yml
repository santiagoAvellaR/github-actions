name: Workflow con múltiples triggers
on:
  push:
    branches:
      - '**'  # Cualquier rama
  pull_request:
    branches:
      - main
      - aprendiendo-github-actionsname: Workflow con múltiples triggers y mejoras
on:
  push:
    branches:
      - main
      - aprendiendo-github-actions
  pull_request:
    branches:
      - main
      - aprendiendo-github-actions
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar hola.py
        run: python hola.py
      - name: Verificar errores
        run: |
          if [ $? -ne 0 ]; then
            echo "Error al ejecutar el script"
            exit 1
          fi  # O la rama principal que uses
  workflow_dispatch:  # Permite ejecutar manualmente el workflow
  schedule:
    - cron: '0 6 * * *'  # Todos los días a las 6:00am UTC

